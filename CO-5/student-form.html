<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id == null ? 'Add Student' : 'Edit Student'}">Student Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f5f5f5; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 10px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; }
        button { margin-top: 20px; padding: 10px 18px; background: #2563eb; color: white; border: 0; border-radius: 6px; }
        .error { color: #b91c1c; font-size: 14px; }
        a { display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${student.id == null ? 'Add Student' : 'Edit Student'}">Student</h1>
    <form th:action="${student.id == null ? '/students/save' : '/students/update'}"
          th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}">

        <label>Name</label>
        <input type="text" th:field="*{name}">
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label>Course</label>
        <input type="text" th:field="*{course}">
        <div class="error" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></div>

        <label>Age</label>
        <input type="number" th:field="*{age}">
        <div class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>

        <button type="submit">Save Student</button>
    </form>
    <a href="/students">← Back to Students</a>
</div>
</body>
</html>
